<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-Registration</title>
</head>

<body>
    <h1>Student Registration</h1>
    <form action="/view" method="POST">
        <label>Name:</label>
        <input type="text" name="name" id="name" value="" placeholder="Enter your name" required />
        <label>Roll No:</label>
        <input type="text" name="rollno" id="rollno" value="" placeholder="Enter your roll number" required />
        <label>Department:</label>
        <input type="text" name="department" id="department" value="" placeholder="Enter your department" required />
        <button type="submit" value="submit">Register</button>
    </form>
</body>

</html>
